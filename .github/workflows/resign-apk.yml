name: Re-sign APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: '目标 APK 下载地址'
        required: true
        type: string

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: |
          apk_url="${{ inputs.apk_url }}"
          # GitHub Artifact 网页/下载 URL → API 下载 URL
          if echo "$apk_url" | grep -qE 'github\.com/[^/]+/[^/]+/actions/(runs|download)/[^/]+/artifacts/'; then
            owner=$(echo "$apk_url" | sed -E 's#https://github\.com/([^/]+)/([^/]+)/.*#\1#')
            repo=$(echo "$apk_url" | sed -E 's#https://github\.com/([^/]+)/([^/]+)/.*#\2#')
            artifact_id=$(echo "$apk_url" | sed -E 's#.*artifacts/([0-9]+).*#\1#')
            apk_url="https://api.github.com/repos/$owner/$repo/actions/artifacts/$artifact_id/zip"
            echo "转换为 API 下载地址: $apk_url"
          fi

          # 跨仓库 Artifact 下载需要专用 token，优先用 ARTIFACT_TOKEN
          dl_token="${{ secrets.ARTIFACT_TOKEN }}"
          [ -z "$dl_token" ] && dl_token="$GITHUB_TOKEN"
          curl -L --max-time 600 --retry 3 -H "Authorization: token $dl_token" -o download.zip "$apk_url"
          file download.zip | grep -q 'Zip archive' || { echo "ERROR: 下载的文件不是有效的 APK/ZIP"; exit 1; }

          # 递归解包（GitHub Artifact 可能多层嵌套，如 ZIP→ZIP→APK）
          mkdir -p work && cp download.zip work/ && cd work
          for i in $(seq 1 10); do
            apk_path=$(find . -type f -name "*.apk" | head -1)
            if [ -n "$apk_path" ]; then
              cp "$apk_path" ../original.apk
              cd .. && rm -rf work
              echo "找到 APK: $apk_path"
              exit 0
            fi
            zip_path=$(find . -type f -name "*.zip" | head -1)
            if [ -z "$zip_path" ]; then
              echo "ERROR: 未找到 APK"
              exit 1
            fi
            dir=$(dirname "$zip_path")
            unzip -o "$zip_path" -d "$dir"
            rm "$zip_path"
          done
          echo "ERROR: 递归解包超限"
          exit 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0'

      - name: Setup 7z Encryption
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > keystore.jks

      - name: Strip Old Signature
        run: |
          unzip -o original.apk -d extracted
          rm -rf extracted/META-INF/
          cd extracted && zip -r -X ../unsigned.apk .

      - name: Zipalign
        run: $ANDROID_HOME/build-tools/34.0.0/zipalign -f -v 4 unsigned.apk aligned.apk

      - name: Sign
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEY_STORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            aligned.apk

      - name: Verify
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify aligned.apk

      - name: Encrypt with Password
        run: |
          if [ -z "${{ secrets.APK_PASSWORD }}" ]; then
            echo "ERROR: APK_PASSWORD secret 未配置"
            exit 1
          fi
          echo "${{ secrets.APK_PASSWORD }}" | 7z a -p -mhe=on -tzip signed-apk-encrypted.zip aligned.apk >/dev/null

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: signed-apk-encrypted.zip