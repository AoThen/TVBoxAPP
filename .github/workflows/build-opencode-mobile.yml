name: Build-OpenCode-Mobile

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'APK 包名 applicationId（留空 = 默认 cc.agentlabs.opencode）'
        required: false
        default: ''
        type: string
      app_name:
        description: '应用显示名称（留空 = 默认 OpenCode）'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 1

      - name: Checkout Source Code
        run: |
          git clone --depth 1 https://github.com/agogo233/opencode-mobile opencode-mobile

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "y" | "$SDKMANAGER" --install "ndk;27.1.12297006" --sdk_root="$ANDROID_HOME"

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Install Dependencies
        working-directory: opencode-mobile
        run: npm ci

      - name: Expo prebuild
        working-directory: opencode-mobile
        run: npx expo prebuild --platform android --no-install

      - name: Override package & app name
        if: inputs.package_name != '' || inputs.app_name != ''
        working-directory: opencode-mobile
        env:
          PKG: ${{ inputs.package_name }}
          APP: ${{ inputs.app_name }}
        run: |
          if [[ -n "$PKG" ]]; then
            [[ "$PKG" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || { echo "非法包名: $PKG"; exit 1; }
            sed -i "s/applicationId '[^']*'/applicationId '$PKG'/" android/app/build.gradle
            echo "applicationId -> $PKG"
            grep -n "applicationId" android/app/build.gradle
            echo "PKG_SUFFIX=_$PKG" >> $GITHUB_ENV
          fi
          if [[ -n "$APP" ]]; then
            if printf '%s' "$APP" | grep -q '[<>&"\\|]'; then echo "显示名含特殊字符: $APP"; exit 1; fi
            sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$APP</string>|" android/app/src/main/res/values/strings.xml
            echo "app_name -> $APP"
            grep -n "app_name" android/app/src/main/res/values/strings.xml
          fi

      - name: Build Tailscale AAR
        working-directory: opencode-mobile
        run: bash scripts/build-tailscale-aar.sh

      - name: Build APK (arm64-v8a, release)
        working-directory: opencode-mobile/android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          tag=$(git -C .. log -1 --date=format:'%Y%m%d-%H%M' --pretty=format:%cd)
          echo "TAG=$tag" >> $GITHUB_ENV
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Prepare Artifact
        run: |
          mkdir -p OutAPK/
          cp opencode-mobile/android/app/build/outputs/apk/release/app-release.apk "OutAPK/OpenCode-Mobile_${{ env.TAG }}${{ env.PKG_SUFFIX }}_arm64-v8a.apk"
          ls -la OutAPK/

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Mobile_${{ env.TAG }}${{ env.PKG_SUFFIX }}
          path: OutAPK/*.apk
          retention-days: 7