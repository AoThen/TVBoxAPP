name: Build-OpenCode-Mobile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 1

      - name: Checkout Source Code
        run: |
          git clone --depth 1 https://github.com/agogo233/opencode-mobile opencode-mobile

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" --sdk_root=$ANDROID_HOME

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Install Dependencies
        working-directory: opencode-mobile
        run: npm ci

      - name: Build APK (arm64-v8a, release)
        working-directory: opencode-mobile/android
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          tag=$(git -C .. log -1 --date=format:'%Y%m%d-%H%M' --pretty=format:%cd)
          echo "TAG=$tag" >> $GITHUB_ENV
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Prepare Artifact
        run: |
          mkdir -p OutAPK/
          cp opencode-mobile/android/app/build/outputs/apk/release/app-release.apk OutAPK/OpenCode-Mobile_${{ env.TAG }}_arm64-v8a.apk
          ls -la OutAPK/

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Mobile_${{ env.TAG }}
          path: OutAPK/*.apk
          retention-days: 7